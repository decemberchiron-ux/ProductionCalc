* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--appBg); color: var(--textMain); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
input, textarea, select { font-family: inherit; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s, transform .1s; }
.btn:active { opacity: .8; transform: scale(.97); }
.btn-primary { background: var(--brand); color: #fff; }
.btn-ghost { background: var(--brandLight); color: var(--brand); }
.btn-danger { background: #FEE2E2; color: var(--danger); }
.input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--borderCol); border-radius: 10px; background: var(--inputBg); color: var(--textMain); font-size: 15px; outline: none; transition: border-color .15s; }
.input:focus { border-color: var(--brand); }
.label { font-size: 13px; font-weight: 600; color: var(--textMuted); margin-bottom: 4px; display: block; }
.card { background: var(--cardBg); border: 1px solid var(--borderCol); border-radius: 14px; padding: 14px; margin-bottom: 10px; }

.toggle-btn.active { background: var(--brand); color: #fff; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 10px; }
.empty-icon { font-size: 48px; }
.empty-title { font-size: 18px; font-weight: 700; color: var(--textMain); }
.empty-desc { font-size: 14px; color: var(--textMuted); text-align: center; }

.cost-row:last-child { border-bottom: none; }

.summary-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 14px; }
.summary-total { font-size: 18px; font-weight: 700; color: var(--brand); }

.compact-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--borderCol); }
