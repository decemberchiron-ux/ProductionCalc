// ─── Unit Conversion ──────────────────────────────────────────────────────────
const UNIT_MAP = {
  Kg: { base: 'Kg', factor: 1 },
  g: { base: 'Kg', factor: 0.001 },
  'ပိဿာ': { base: 'ပိဿာ', factor: 1 },
  'ကျပ်သား': { base: 'ပိဿာ', factor: 0.01 },
  Liter: { base: 'Liter', factor: 1 },
  ml: { base: 'Liter', factor: 0.001 },
  PCS: { base: 'PCS', factor: 1 },
};
const CROSS = {
  Kg: { 'ပိဿာ': 1 / 1.6329 },
  g: { 'ပိဿာ': 0.001 / 1.6329, 'ကျပ်သား': 0.001 / (1.6329 * 0.01) },
  'ပိဿာ': { Kg: 1.6329, g: 1632.9 },
  'ကျပ်သား': { Kg: 0.016329, g: 16.329 },
};
const UNITS = ['Kg', 'g', 'ပိဿာ', 'ကျပ်သား', 'Liter', 'ml', 'PCS'];
const THEMES = [
  { id: 'warm-bakery', name: '🍞 Warm Bakery' },
  { id: 'midnight-dark', name: '🌙 Midnight Dark' },
  { id: 'mint-matcha', name: '🍵 Mint Matcha' },
  { id: 'royal-velvet', name: '💜 Royal Velvet' },
  { id: 'minimal-slate', name: '⬜ Minimal Slate' },
];

function convertUnit(qty, from, to) {
  if (from === to) return qty;
  const f = UNIT_MAP[from], t = UNIT_MAP[to];
  if (!f || !t) return null;
  if (f.base === t.base) return (qty * f.factor) / t.factor;
  const cf = CROSS[from]?.[to];
  if (cf !== undefined) return qty * cf;
  return null;
}
function getPPU(ing) {
  if (!ing.packageQty || ing.packageQty <= 0) return 0;
  return ing.packagePrice / ing.packageQty;
}
function getDerivedPrices(ing) {
  const ppu = getPPU(ing);
  return UNITS.map(u => {
    const conv = convertUnit(1, u, ing.unit);
    if (conv === null || conv <= 0) return null;
    const price = ppu * conv;
    if (price <= 0) return null;
    return `1 ${u} = ${formatKs(price)}`;
  }).filter(Boolean);
}
function getCompatibleUnits(unit) {
  const info = UNIT_MAP[unit];
  if (!info) return [unit];
  const same = Object.entries(UNIT_MAP).filter(([,u]) => u.base === info.base).map(([u]) => u);
  const cross = new Set();
  same.forEach(u => Object.keys(CROSS[u] || {}).forEach(t => cross.add(t)));
  const trans = new Set();
  cross.forEach(t => { const ti = UNIT_MAP[t]; if (ti) Object.entries(UNIT_MAP).filter(([,u]) => u.base === ti.base).forEach(([u]) => trans.add(u)); });
  const all = new Set([...same, ...cross, ...trans]);
  return UNITS.filter(u => all.has(u));
}
function calcIngCost(row, ingredients) {
  const ing = ingredients.find(i => i.id === row.ingredientId);
  if (!ing) return 0;
  const ppu = getPPU(ing);
  const used = row.usedUnit || ing.unit;
  if (used === ing.unit) return ppu * row.quantity;
  const conv = convertUnit(row.quantity, used, ing.unit);
  return ppu * (conv !== null ? conv : row.quantity);
}
function resolveOptional(cost, ingTotal) {
  if (!cost || !cost.enabled) return 0;
  if (cost.isPercent) return (ingTotal * cost.amount) / 100;
  return cost.amount || 0;
}
function calcTotal(product, ingredients) {
  const ing = product.ingredientRows.reduce((s, r) => s + calcIngCost(r, ingredients), 0);
  return ing
    + resolveOptional(product.packaging, ing)
    + resolveOptional(product.labor, ing)
    + resolveOptional(product.overhead, ing)
    + resolveOptional(product.transport, ing)
    + resolveOptional(product.wastage, ing);
}
function formatKs(n) { return Math.round(n * 100) / 100 === 0 ? '0 Ks' : (Math.round(n * 100) / 100).toLocaleString('en-US') + ' Ks'; }
function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function toNum(s) { return parseFloat(String(s).replace(/[၀-၉]/g, c => String('၀၁၂၃၄၅၆၇၈၉'.indexOf(c)))); }

// ─── Storage ──────────────────────────────────────────────────────────────────
const STORE_KEY = 'prod_calc_v2';
function loadData() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; }
}
function saveData(data) { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

// ─── Default OptionalCost ─────────────────────────────────────────────────────
const defCost = () => ({ enabled: false, amount: 0, isPercent: false });

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('products');
  const [theme, setTheme] = useState(() => loadData().theme || 'warm-bakery');
  const [profiles, setProfiles] = useState(() => loadData().profiles || [{ id: 'default', name: 'Production', createdAt: Date.now() }]);
  const [activeProfileId, setActiveProfileId] = useState(() => loadData().activeProfileId || 'default');
  const [ingredients, setIngredients] = useState(() => loadData().ingredients || []);
  const [products, setProducts] = useState(() => loadData().products || []);

  // Persist
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    saveData({ theme, profiles, activeProfileId, ingredients, products });
  }, [theme, profiles, activeProfileId, ingredients, products]);

  const activeProfile = profiles.find(p => p.id === activeProfileId) || profiles[0];

  return (
    <div style={{ minHeight: '100vh', background: 'var(--appBg)' }}>
      {/* Header */}
      <div className="header">
        <div style={{ display: 'flex', flexDirection: 'column' }}>
          <span style={{ fontWeight: 700, fontSize: 16, color: 'var(--textMain)' }}>Production Calculate</span>
          <span style={{ fontSize: 12, color: 'var(--textMuted)' }}>{activeProfile?.name}</span>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <ProfileSwitcher profiles={profiles} activeProfileId={activeProfileId} setActiveProfileId={setActiveProfileId} setProfiles={setProfiles} />
          <ThemeSwitcher theme={theme} setTheme={setTheme} />
        </div>
      </div>

      {/* Tab Content */}
      <div>
        {tab === 'products' && <ProductsTab ingredients={ingredients} products={products} setProducts={setProducts} />}
        {tab === 'ingredients' && <IngredientsTab ingredients={ingredients} setIngredients={setIngredients} />}
        {tab === 'settings' && <SettingsTab ingredients={ingredients} products={products} setIngredients={setIngredients} setProducts={setProducts} profiles={profiles} setProfiles={setProfiles} activeProfileId={activeProfileId} setActiveProfileId={setActiveProfileId} theme={theme} setTheme={setTheme} />}
      </div>

      {/* Tab Bar */}
      <div className="tab-bar">
        {[
          { id: 'products', label: 'ထုတ်ကုန်', icon: 'home' },
          { id: 'ingredients', label: 'ကုန်ကြမ်း', icon: 'shopping-basket' },
          { id: 'settings', label: 'ဆက်တင်', icon: 'settings' },
        ].map(t => (
          <button key={t.id} className={`tab-item ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>

            <span>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

  return (
    <div style={{ position: 'relative' }}>
      <button className="profile-badge" onClick={() => setOpen(!open)}>

        <Icon name="chevron-down" size={12} color="var(--brand)" />
      </button>
      {open && (
        <div style={{ position: 'absolute', right: 0, top: '110%', background: 'var(--cardBg)', border: '1px solid var(--borderCol)', borderRadius: 12, minWidth: 200, zIndex: 200, boxShadow: '0 8px 24px rgba(0,0,0,.15)', padding: 8 }}>

            <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 10px', borderRadius: 8, cursor: 'pointer', background: p.id === activeProfileId ? 'var(--brandLight)' : 'transparent' }}

                </button>
              )}

          ))}

            <div style={{ padding: '4px 6px', display: 'flex', gap: 6 }}>
              <input className="input" style={{ fontSize: 13, padding: '6px 10px' }} placeholder="Profile အမည်" value={newName} onChange={e => setNewName(e.target.value)} autoFocus onKeyDown={e => { if (e.key === 'Enter' && newName.trim()) { setProfiles(prev => [...prev, { id: uid(), name: newName.trim(), createdAt: Date.now() }]); setNewName(''); setAddMode(false); }}} />
              <button className="btn btn-primary" style={{ padding: '6px 12px', fontSize: 13 }} onClick={() => { if (newName.trim()) { setProfiles(prev => [...prev, { id: uid(), name: newName.trim(), createdAt: Date.now() }]); setNewName(''); setAddMode(false); }}}>+</button>
            </div>

            <button style={{ width: '100%', padding: '8px 10px', border: 'none', background: 'none', cursor: 'pointer', color: 'var(--brand)', fontSize: 13, fontWeight: 600, textAlign: 'left', borderRadius: 8 }} onClick={() => setAddMode(true)}>+ Profile အသစ်ထည့်ရန်</button>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Theme Switcher ───────────────────────────────────────────────────────────
function ThemeSwitcher({ theme, setTheme }) {

  return (
    <div style={{ position: 'relative' }}>

      </button>
      {open && (
        <div style={{ position: 'absolute', right: 0, top: '110%', background: 'var(--cardBg)', border: '1px solid var(--borderCol)', borderRadius: 12, minWidth: 180, zIndex: 200, boxShadow: '0 8px 24px rgba(0,0,0,.15)', padding: 8 }}>

              onClick={() => { setTheme(t.id); document.documentElement.setAttribute('data-theme', t.id); setOpen(false); }}>

// ─── Products Tab ─────────────────────────────────────────────────────────────
function ProductsTab({ ingredients, products, setProducts }) {
  const [showCalc, setShowCalc] = useState(false);
  const [editProduct, setEditProduct] = useState(null);
  const [viewDetail, setViewDetail] = useState(null);

  const handleDelete = (id) => {
    if (confirm('ဒီ product ကို ဖျက်မည်လား?')) setProducts(prev => prev.filter(p => p.id !== id));
  };

  if (showCalc || editProduct) {
    return <ProductCalculator ingredients={ingredients} editProduct={editProduct} onSave={p => { setProducts(prev => editProduct ? prev.map(x => x.id === p.id ? p : x) : [...prev, p]); setShowCalc(false); setEditProduct(null); }} onCancel={() => { setShowCalc(false); setEditProduct(null); }} />;
  }
  if (viewDetail) {
    return <ProductDetail product={viewDetail} ingredients={ingredients} onBack={() => setViewDetail(null)} onEdit={p => { setEditProduct(p); setViewDetail(null); }} onDelete={id => { handleDelete(id); setViewDetail(null); }} />;
  }

  return (
    <div className="page-content">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <h2 className="section-title" style={{ margin: 0 }}>ထုတ်ကုန်များ</h2>
        <span style={{ fontSize: 12, color: 'var(--textMuted)' }}>{products.length} ခု</span>
      </div>
      {products.length === 0 ? (
        <div className="empty-state">
          <div className="empty-icon">🥐</div>
          <div className="empty-title">ထုတ်ကုန် မရှိသေးပါ</div>
          <div className="empty-desc">+ ခလုတ်နှိပ်ပြီး ထုတ်ကုန်အသစ် ထည့်ပါ</div>
        </div>
      ) : (
        products.map(p => {
          const total = calcTotal(p, ingredients);
          const unitP = p.productQty && p.productQty > 0 ? total / p.productQty : null;
          return (
            <div key={p.id} className="card" style={{ cursor: 'pointer' }} onClick={() => setViewDetail(p)}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 16, color: 'var(--textMain)', marginBottom: 4 }}>{p.name}</div>
                  <div style={{ fontSize: 13, color: 'var(--textMuted)', marginBottom: 6 }}>{formatDate(p.createdAt)}</div>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                    <span className="chip">စုစုပေါင်း: {formatKs(total)}</span>
                    {unitP !== null && <span className="chip">တစ်ခု: {formatKs(unitP)}</span>}
                    {p.productQty > 0 && <span className="chip">{p.productQty} ခု</span>}
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 6, marginLeft: 8 }}>
                  <button className="btn btn-ghost" style={{ padding: '6px 10px' }} onClick={e => { e.stopPropagation(); setEditProduct(p); }}>
                    <Icon name="pencil" size={15} color="var(--brand)" />
                  </button>
                  <button className="btn btn-danger" style={{ padding: '6px 10px' }} onClick={e => { e.stopPropagation(); handleDelete(p.id); }}>
                    <Icon name="trash" size={15} color="var(--danger)" />
                  </button>
                </div>
              </div>
            </div>
          );
        })
      )}
      <div className="footer">Creator — Lwin Oo</div>
      <button className="fab" onClick={() => setShowCalc(true)}>
        <Icon name="plus" size={26} color="#fff" />
      </button>
    </div>
  );
}

// ─── Product Detail ───────────────────────────────────────────────────────────
function ProductDetail({ product, ingredients, onBack, onEdit, onDelete }) {
  const total = calcTotal(product, ingredients);
  const ingTotal = product.ingredientRows.reduce((s, r) => s + calcIngCost(r, ingredients), 0);
  const unitP = product.productQty && product.productQty > 0 ? total / product.productQty : null;

  return (
    <div className="page-content">
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>

        <button className="btn btn-ghost" style={{ padding: '6px 10px' }} onClick={() => onEdit(product)}><Icon name="pencil" size={15} color="var(--brand)" /></button>

        </div>

      {[
        { key: 'packaging', label: 'Packaging' },

      </div>
      <div className="footer">Creator — Lwin Oo</div>
    </div>
  );
}

// ─── Product Calculator ───────────────────────────────────────────────────────
function ProductCalculator({ ingredients, editProduct, onSave, onCancel }) {
  const [name, setName] = useState(editProduct?.name || '');
  const [rows, setRows] = useState(editProduct?.ingredientRows || []);
  const [packaging, setPackaging] = useState(editProduct?.packaging || defCost());
  const [labor, setLabor] = useState(editProduct?.labor || defCost());
  const [overhead, setOverhead] = useState(editProduct?.overhead || defCost());
  const [transport, setTransport] = useState(editProduct?.transport || defCost());
  const [wastage, setWastage] = useState(editProduct?.wastage || defCost());
  const [productQty, setProductQty] = useState(editProduct?.productQty ? String(editProduct.productQty) : '');

  const ingTotal = rows.reduce((s, r) => s + calcIngCost(r, ingredients), 0);
  const total = ingTotal
    + resolveOptional(packaging, ingTotal)
    + resolveOptional(labor, ingTotal)
    + resolveOptional(overhead, ingTotal)
    + resolveOptional(transport, ingTotal)
    + resolveOptional(wastage, ingTotal);
  const qty = toNum(productQty);
  const unitPrice = !isNaN(qty) && qty > 0 ? total / qty : null;

  const addRow = () => {
    if (ingredients.length === 0) return alert('ကုန်ကြမ်း မရှိသေးပါ');
    setRows(prev => [...prev, { ingredientId: ingredients[0].id, quantity: 1, usedUnit: ingredients[0].unit }]);
  };
  const updateRow = (i, field, val) => setRows(prev => prev.map((r, idx) => idx === i ? { ...r, [field]: val } : r));
  const removeRow = (i) => setRows(prev => prev.filter((_, idx) => idx !== i));

  const handleSave = () => {
    if (!name.trim()) return alert('ထုတ်ကုန်အမည် ထည့်ပေးပါ');
    const qtyNum = toNum(productQty);
    onSave({
      id: editProduct?.id || uid(),
      name: name.trim(),
      ingredientRows: rows,
      packaging, labor, overhead, transport, wastage,
      productQty: !isNaN(qtyNum) && qtyNum > 0 ? qtyNum : 0,
      createdAt: editProduct?.createdAt || Date.now(),
    });
  };

  return (
    <div className="page-content">
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
        <button className="btn btn-ghost" style={{ padding: '6px 12px' }} onClick={onCancel}>← နောက်သို့</button>
        <h2 style={{ flex: 1, fontWeight: 700, fontSize: 18, color: 'var(--textMain)', margin: 0 }}>{editProduct ? 'ပြင်ဆင်ရန်' : 'ထုတ်ကုန်အသစ်'}</h2>
      </div>

      <div className="card">
        <label className="label">ထုတ်ကုန်အမည်</label>
        <input className="input" placeholder="ဥပမာ — Chocolate Cake" value={name} onChange={e => setName(e.target.value)} />
      </div>

      <div className="card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <span className="section-title" style={{ margin: 0, fontSize: 15 }}>ကုန်ကြမ်းများ</span>
          <button className="btn btn-ghost" style={{ padding: '5px 12px', fontSize: 13 }} onClick={addRow}>+ ထည့်ရန်</button>
        </div>
        {rows.length === 0 && <div style={{ color: 'var(--textMuted)', fontSize: 13, textAlign: 'center', padding: '12px 0' }}>ကုန်ကြမ်း မရှိသေးပါ</div>}
        {rows.map((row, i) => {
          const ing = ingredients.find(x => x.id === row.ingredientId);
          const compatible = ing ? getCompatibleUnits(ing.unit) : [];
          const cost = calcIngCost(row, ingredients);
          return (
            <div key={i} className="ing-row-card">
              <div style={{ display: 'flex', gap: 8, marginBottom: 8, alignItems: 'center' }}>
                <select className="select" style={{ flex: 2 }} value={row.ingredientId} onChange={e => { const newIng = ingredients.find(x => x.id === e.target.value); updateRow(i, 'ingredientId', e.target.value); if (newIng) updateRow(i, 'usedUnit', newIng.unit); }}>
                  {ingredients.map(ing => <option key={ing.id} value={ing.id}>{ing.name}</option>)}
                </select>
                <button style={{ border: 'none', background: 'none', cursor: 'pointer', padding: 4 }} onClick={() => removeRow(i)}>
                  <Icon name="x" size={16} color="var(--danger)" />
                </button>
              </div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <input className="input" style={{ flex: 1 }} type="number" placeholder="ပမာဏ" value={row.quantity} onChange={e => updateRow(i, 'quantity', parseFloat(e.target.value) || 0)} />
                <select className="select" style={{ flex: 1 }} value={row.usedUnit || ing?.unit || ''} onChange={e => updateRow(i, 'usedUnit', e.target.value)}>
                  {compatible.map(u => <option key={u} value={u}>{u}</option>)}
                </select>
                <span style={{ minWidth: 80, textAlign: 'right', fontSize: 13, fontWeight: 600, color: 'var(--brand)' }}>{formatKs(cost)}</span>
              </div>
            </div>
          );
        })}
        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 8, fontWeight: 700, fontSize: 14, color: 'var(--brand)' }}>
          Ingredient စုစုပေါင်း: {formatKs(ingTotal)}
        </div>
      </div>

      {/* Optional Costs */}
      {[
        { key: 'packaging', label: 'Packaging', state: packaging, set: setPackaging },
        { key: 'labor', label: 'Labor / လုပ်ခ', state: labor, set: setLabor },
        { key: 'overhead', label: 'Overhead', state: overhead, set: setOverhead },
        { key: 'transport', label: 'Transport', state: transport, set: setTransport },
        { key: 'wastage', label: 'Wastage / အပျက်စီး', state: wastage, set: setWastage },
      ].map(({ key, label, state, set }) => (
        <div key={key} className="card" style={{ padding: '10px 14px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>

            <span style={{ flex: 1, fontWeight: 600, fontSize: 14, color: 'var(--textMain)' }}>{label}</span>
            {state.enabled && (
              <div className="toggle-group" style={{ padding: 2 }}>
                <button className={`toggle-btn ${!state.isPercent ? 'active' : ''}`} style={{ padding: '3px 8px', fontSize: 12 }} onClick={() => set(prev => ({ ...prev, isPercent: false }))}>Ks</button>
                <button className={`toggle-btn ${state.isPercent ? 'active' : ''}`} style={{ padding: '3px 8px', fontSize: 12 }} onClick={() => set(prev => ({ ...prev, isPercent: true }))}>%</button>

          {state.enabled && (
            <div style={{ marginTop: 8, display: 'flex', gap: 8, alignItems: 'center' }}>
              <input className="input" type="number" placeholder={state.isPercent ? "ရာခိုင်နှုန်း %" : "ပမာဏ (Ks)"} value={state.amount || ''} onChange={e => set(prev => ({ ...prev, amount: parseFloat(e.target.value) || 0 }))} />
              <span style={{ fontSize: 13, color: 'var(--brand)', fontWeight: 600, minWidth: 70, textAlign: 'right' }}>{formatKs(resolveOptional(state, ingTotal))}</span>
            </div>
          )}
        </div>
      ))}

      {/* Product Qty */}
      <div className="card">
        <label className="label">ထုတ်ကုန်အရေအတွက် (ခု)</label>
        <input className="input" type="number" placeholder="ဥပမာ — 10" value={productQty} onChange={e => setProductQty(e.target.value)} />
        {unitPrice !== null && (
          <div style={{ marginTop: 8, display: 'flex', justifyContent: 'space-between', fontSize: 14 }}>
            <span style={{ color: 'var(--textMuted)' }}>တစ်ခုချင်းတန်ဖိုး</span>
            <span style={{ fontWeight: 700, color: 'var(--success)' }}>{formatKs(unitPrice)}</span>
          </div>
        )}
      </div>

      {/* Summary */}
      <div className="summary-box">
        <div className="summary-row"><span style={{ fontWeight: 700, fontSize: 16 }}>စုစုပေါင်း ကုန်ကျ</span><span className="summary-total" style={{ fontSize: 20 }}>{formatKs(total)}</span></div>
        {unitPrice !== null && <div className="summary-row"><span style={{ fontWeight: 600 }}>တစ်ခုချင်းတန်ဖိုး</span><span style={{ fontWeight: 700, color: 'var(--success)' }}>{formatKs(unitPrice)}</span></div>}
      </div>

      <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
        <button className="btn" style={{ flex: 1, background: 'var(--borderCol)', color: 'var(--textMuted)', justifyContent: 'center' }} onClick={onCancel}>မသိမ်းဘဲ ပြန်ထွက်</button>
        <button className="btn btn-primary" style={{ flex: 2, justifyContent: 'center' }} onClick={handleSave}>{editProduct ? '✓ ပြင်ဆင်မည်' : '✓ သိမ်းဆည်းမည်'}</button>
      </div>
      <div className="footer">Creator — Lwin Oo</div>
    </div>

}

// ─── Ingredients Tab ──────────────────────────────────────────────────────────
function IngredientsTab({ ingredients, setIngredients }) {
  const [search, setSearch] = useState('');
  const [viewMode, setViewMode] = useState('card');
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [historyIng, setHistoryIng] = useState(null);

  const [name, setName] = useState('');
  const [packageQty, setPackageQty] = useState('1');
  const [unit, setUnit] = useState('Kg');
  const [packagePrice, setPackagePrice] = useState('');

  const filtered = search.trim() ? ingredients.filter(i => i.name.toLowerCase().includes(search.toLowerCase())) : ingredients;

  const openAdd = () => { setEditing(null); setName(''); setPackageQty('1'); setUnit('Kg'); setPackagePrice(''); setShowModal(true); };
  const openEdit = (ing) => { setEditing(ing); setName(ing.name); setPackageQty(String(ing.packageQty)); setUnit(ing.unit); setPackagePrice(String(ing.packagePrice)); setShowModal(true); };

  const previewDerived = (() => {
    const q = toNum(packageQty), p = toNum(packagePrice);
    if (!isNaN(q) && q > 0 && !isNaN(p) && p > 0) return getDerivedPrices({ id: '', name: '', packageQty: q, unit, packagePrice: p });
    return [];
  })();

  const handleSave = () => {
    if (!name.trim()) return alert('ကုန်ကြမ်းအမည် ထည့်ပေးပါ');
    const q = toNum(packageQty), p = toNum(packagePrice);
    if (isNaN(q) || q <= 0) return alert('ပမာဏ မှားနေသည်');
    if (isNaN(p) || p < 0) return alert('ဈေးနှုန်း မှားနေသည်');
    const ing = {
      id: editing ? editing.id : uid(),
      name: name.trim(), packageQty: q, unit, packagePrice: p,
      createdAt: editing ? editing.createdAt : Date.now(),
      priceHistory: editing ? [
        ...(editing.priceHistory || []),
        { packageQty: editing.packageQty, unit: editing.unit, packagePrice: editing.packagePrice, changedAt: Date.now() }
      ] : [],

    setIngredients(prev => editing ? prev.map(x => x.id === ing.id ? ing : x) : [...prev, ing]);
    setShowModal(false);
  };

  const handleDelete = (id) => { if (confirm('ဒီ ကုန်ကြမ်းကို ဖျက်မည်လား?')) setIngredients(prev => prev.filter(i => i.id !== id)); };

        </div>

          </div>

                    <span className="chip">{ing.packageQty} {ing.unit} = {formatKs(ing.packagePrice)}</span>

                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>

                    {hasHistory && (
                      <button style={{ border: 'none', background: 'var(--brandLight)', borderRadius: 6, padding: '2px 8px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4, fontSize: 11, color: 'var(--brand)', fontWeight: 600 }} onClick={() => setHistoryIng(ing)}>
                        <Icon name="clock" size={11} color="var(--brand)" /> {ing.priceHistory.length} ကြိမ် ပြောင်းခဲ့သည်

                  <button className="btn btn-danger" style={{ padding: '6px 10px' }} onClick={() => handleDelete(ing.id)}><Icon name="trash" size={15} color="var(--danger)" /></button>

      <div className="footer">Creator — Lwin Oo</div>

      {/* Add/Edit Modal */}
      {showModal && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowModal(false)}>

            <label className="label">ကုန်ကြမ်းအမည်</label>
            <input className="input" style={{ marginBottom: 12 }} placeholder="ဂျုံ ၊ သကြား ၊ ဆီ" value={name} onChange={e => setName(e.target.value)} />

              </div>
            </div>
            <button className="btn btn-ghost" style={{ width: '100%', justifyContent: 'center', marginTop: 12 }} onClick={() => setHistoryIng(null)}>ပိတ်မည်</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Settings Tab ─────────────────────────────────────────────────────────────
function SettingsTab({ ingredients, products, setIngredients, setProducts, profiles, setProfiles, activeProfileId, setActiveProfileId, theme, setTheme }) {
  const fileRef = useRef(null);

  const exportJSON = () => {
    const data = { version: 2, exportedAt: Date.now(), profiles, activeProfileId, ingredients, products };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `prod-calc-backup-${formatDate(Date.now())}.json`; a.click();
  };

  const exportCSV = () => {
    const rows = [['Product Name', 'Total Cost (Ks)', 'Qty', 'Unit Price (Ks)', 'Date']];
    products.forEach(p => {
      const total = calcTotal(p, ingredients);
      const uPrice = p.productQty > 0 ? total / p.productQty : '';
      rows.push([p.name, total.toFixed(2), p.productQty || '', uPrice ? uPrice.toFixed(2) : '', formatDate(p.createdAt)]);
    });
    const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `prod-calc-products-${formatDate(Date.now())}.csv`; a.click();
  };

  const importJSON = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.ingredients) setIngredients(data.ingredients);
        if (data.products) setProducts(data.products);
        if (data.profiles) setProfiles(data.profiles);
        if (data.activeProfileId) setActiveProfileId(data.activeProfileId);
        alert('Restore အောင်မြင်ပါသည်!');
      } catch { alert('ဖိုင် မမှန်ကန်ပါ'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const clearAll = () => {
    if (confirm('ဒေတာ အားလုံး ဖျက်မည်လား? ဤလုပ်ဆောင်ချက်ကို ပြန်မလုပ်နိုင်ပါ!')) {
      setIngredients([]); setProducts([]);
    }
  };

  return (
    <div className="page-content">
      <h2 className="section-title">ဆက်တင်များ</h2>


      {/* Backup */}
      <div className="card" style={{ marginBottom: 12 }}>
        <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--textMain)', marginBottom: 12 }}>💾 Backup & Restore</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <button className="btn btn-ghost" style={{ justifyContent: 'center' }} onClick={exportJSON}>
            <Icon name="file-up" size={16} color="var(--brand)" /> JSON Backup ထုတ်ရန်
          </button>
          <button className="btn btn-ghost" style={{ justifyContent: 'center' }} onClick={exportCSV}>
            <Icon name="table-2" size={16} color="var(--brand)" /> CSV Export (Products)
          </button>
          <button className="btn btn-ghost" style={{ justifyContent: 'center' }} onClick={() => fileRef.current?.click()}>
            <Icon name="file-down" size={16} color="var(--brand)" /> JSON Restore လုပ်ရန်
          </button>
          <input ref={fileRef} type="file" accept=".json" style={{ display: 'none' }} onChange={importJSON} />
        </div>
      </div>

      {/* Stats */}
      <div className="card" style={{ marginBottom: 12 }}>
        <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--textMain)', marginBottom: 10 }}>📊 အချက်အလက်</div>
        <div style={{ display: 'flex', gap: 10 }}>
          <div style={{ flex: 1, background: 'var(--brandLight)', borderRadius: 10, padding: '12px', textAlign: 'center' }}>
            <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--brand)' }}>{ingredients.length}</div>
            <div style={{ fontSize: 12, color: 'var(--textMuted)' }}>ကုန်ကြမ်း</div>
          </div>
          <div style={{ flex: 1, background: 'var(--brandLight)', borderRadius: 10, padding: '12px', textAlign: 'center' }}>
            <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--brand)' }}>{products.length}</div>
            <div style={{ fontSize: 12, color: 'var(--textMuted)' }}>ထုတ်ကုန်</div>
          </div>
          <div style={{ flex: 1, background: 'var(--brandLight)', borderRadius: 10, padding: '12px', textAlign: 'center' }}>
            <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--brand)' }}>{profiles.length}</div>
            <div style={{ fontSize: 12, color: 'var(--textMuted)' }}>Profile</div>
          </div>
        </div>
      </div>

      {/* Danger */}
      <div className="card" style={{ borderColor: '#FCA5A5' }}>
        <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--danger)', marginBottom: 8 }}>⚠️ အန္တရာယ်ရှိသော လုပ်ဆောင်ချက်</div>
        <button className="btn btn-danger" style={{ width: '100%', justifyContent: 'center' }} onClick={clearAll}>
          <Icon name="trash" size={16} color="var(--danger)" /> ဒေတာ အားလုံး ဖျက်မည်
        </button>
      </div>

      <div className="footer" style={{ marginTop: 24 }}>
        <div style={{ fontWeight: 600, color: 'var(--brand)', fontSize: 14 }}>Production Calculate</div>
        <div>Creator — Lwin Oo</div>
        <div style={{ marginTop: 4, fontSize: 11 }}>v2.0 · Offline PWA</div>
      </div>
    </div>
  );
}
